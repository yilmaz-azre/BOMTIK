return '<div class="pc2 '+c+'"><span class="ic">'+ic+'</span><b>'+esc(p.name)+'</b><span class="hrt">'+hrt(p.lives,s.livesMax)+'</span></div>'}).join('')}
if(ph==='done'){var m=['p2','p1','p3'],o=[1,0,2];$('hPod').innerHTML=o.map(function(i,k){var p=pl[i];return p?'<div class="'+m[k]+'"><em>'+['🥇','🥈','🥉'][i]+'</em><span>'+esc(p.name)+'</span><b>'+p.safe+'</b></div>':''}).join('');$('hLb2').innerHTML=lbHtml(pl,30)}}
$('hostBtn').addEventListener('click',hostOpen);
$('hStart').addEventListener('click',function(){if(!hs)return;$('hMsg').textContent='';api('/api/start',{pin:hs.pin,key:hs.key,rounds:+$('hRounds').value,lives:+$('hLives').value,tp:tp}).catch(function(e){$('hMsg').textContent=errMsg(e)})});
$('hEnd').addEventListener('click',function(){if(hs)api('/api/end',{pin:hs.pin,key:hs.key}).catch(function(){})});
$('hNew').addEventListener('click',function(){if(hs)api('/api/reset',{pin:hs.pin,key:hs.key}).catch(function(){})});
$('hClose').addEventListener('click',function(){if(!hs){show('menu');return}var k={pin:hs.pin,key:hs.key};api('/api/close',k).catch(function(){});hostGone()});
$('hTop').addEventListener('click',function(){topRet='host';topRender();show('topics')});
/* öğrenci */
function openJoin(pin){$('jMsg').textContent='';if(pin)$('jPin').value=pin;show('join');setTimeout(function(){try{($('jPin').value?$('jName'):$('jPin')).focus()}catch(e){}},50)}
$('joinBtn').addEventListener('click',function(){openJoin('')});$('jBack').addEventListener('click',function(){show('menu')});
$('jPin').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,6)});
$('jForm').addEventListener('submit',function(e){e.preventDefault();var pin=$('jPin').value,nm=$('jName').value.trim();
if(!/^\d{6}$/.test(pin)){$('jMsg').textContent=t('badPin');return}if(!nm){$('jMsg').textContent=t('needName');return}
$('jMsg').textContent='';api('/api/join',{pin:pin,name:nm}).then(function(r){leaveClass(true);cls={pin:pin,pid:r.pid,name:r.name,round:0,max:0,lives:0,livesMax:0,res:null,rActive:false,sEnd:0,last:null,tp:null,es:null,clk:0};clsConnect();wRender({n:1});show('wait')},function(e){$('jMsg').textContent=errMsg(e)})});
function clsConnect(){var c=cls,es=new EventSource('/api/play/'+c.pin+'/'+c.pid);c.es=es;c.clk=setInterval(clsClock,250);es.onmessage=function(e){if(cls!==c)return;var m;try{m=JSON.parse(e.data)}catch(x){return}if(m.type==='gone'){clsGone();return}clsState(m)}}
function clsGone(){leaveClass(true);st.over=true;clearInterval(st.iv);show('menu');$('menuMsg').textContent=t('roomGone')}
function leaveClass(silent){if(!cls)return;var c=cls;cls=null;clearInterval(c.clk);try{c.es&&c.es.close()}catch(e){}if(!silent)api('/api/leave',{pin:c.pin,pid:c.pid}).catch(function(){})}
function clsClock(){if(!cls||$('wait').hidden)return;var s=cls.last;if(!s||s.phase!=='play'){$('wClock').textContent='';return}var c=Math.max(0,Math.ceil((cls.sEnd-Date.now())/1000));$('wClock').textContent=s.sub==='break'?t('nextRound',[c]):'⏱ '+c}
function wRender(s){if(!cls)return;s=s||cls.last||{};var res=cls.res||s.res,ph=s.phase,title,text='';
if(ph==='play'||ph==='done'){
if(s.alive===false){title='☠️ '+t('elimT');text=t('elimS')}
else if(res==='safe'){title='🛡️ '+t('safeT');text=s.sub==='break'?'':t('safeS')}
else if(res==='boom'){title='💥 '+t('boomT');text=t('livesLeft',[hrt(s.lives,s.livesMax)])}
else{title=t('roundN',[s.round,s.max]);text=t('safeS')}
$('wCount').textContent=t('aliveN',[s.aliveN||0])+'  ·  🛡️ '+(s.safeN||0)}
else{title=t('waitT',[cls.name]);text=t('waitS');$('wCount').textContent=t('pcount',[s.n||1])}
$('wTitle').textContent=title;$('wSub').textContent=text;clsClock()}
$('wLeave').addEventListener('click',function(){leaveClass();show('menu')});
function clsState(s){if(!cls)return;cls.last=s;cls.sEnd=Date.now()+(s.remaining||0);cls.max=s.max||cls.max;cls.livesMax=s.livesMax||cls.livesMax;if(s.lives!=null)cls.lives=s.lives;
if(s.phase==='lobby'){cls.round=0;cls.res=null;cls.rActive=false;st.over=true;clearInterval(st.iv);wRender(s);if($('wait').hidden)show('wait');return}
if(s.phase==='play'){
if(s.sub==='round'){
if(cls.round!==s.round){cls.round=s.round;cls.res=s.res||null;if(s.alive&&!s.res)startRound(s);else{cls.rActive=false;wRender(s);show('wait')}}
else if(!cls.rActive)wRender(s)}
else{if(cls.rActive||!$('game').hidden){cls.rActive=false;st.over=true;clearInterval(st.iv)}wRender(s);if($('wait').hidden)show('wait');else if(!$('game').hidden)show('wait')}
return}
if(s.phase==='done'){cls.rActive=false;st.over=true;clearInterval(st.iv);clsResult()}}
function startRound(s){clearInterval(st.iv);cls.rActive=true;cls.res=null;cls.tp=s.tp;st.bombs=0;st.goal=Infinity;applyTheme();build();clr();updGoal();st.over=false;show('game');tick();st.iv=setInterval(tick,200)}
function clsSafe(){if(!cls||!cls.rActive)return;var c=cls;c.rActive=false;c.res='safe';st.over=true;api('/api/solve',{pin:c.pin,pid:c.pid,round:c.round}).catch(function(){});
setTimeout(function(){if(cls===c&&c.res==='safe'&&!$('game').hidden){wRender(c.last);show('wait')}},500)}
function clsFail(){if(!cls||!cls.rActive)return;var c=cls;c.rActive=false;c.res='boom';st.over=true;api('/api/fail',{pin:c.pin,pid:c.pid,round:c.round}).catch(function(){});
explode(function(){if(cls===c){wRender(c.last);show('wait')}})}
function clsTimeout(){if(!cls)return;var c=cls;c.res='boom';st.over=true;explode(function(){if(cls===c){wRender(c.last);show('wait')}})}
function clsResult(){var s=cls.last||{};$('endTitle').className='win';$('endTitle').textContent=t('clsEnd');
$('endText').textContent=s.rank?t('clsRank',[s.rank,s.n,s.safe||0]):'';
$('answers').innerHTML=(s.top||[]).map(function(p,i){return '<li>'+['🥇','🥈','🥉'][i]+' <b>'+esc(p.name)+'</b> — '+t('safeRounds',[p.safe])+'</li>'}).join('');show('end')}
(function(){var q=new URLSearchParams(location.search).get('pin');if(q)setTimeout(function(){openJoin(q.replace(/\D/g,'').slice(0,6))},0)})();
applyTheme();
applyLang();
})();
</script>
