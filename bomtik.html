.neonbar{display:flex;gap:8px}.neonbar i{width:40px;height:8px;border-radius:4px;background:#2ef2ff;box-shadow:0 0 12px #2ef2ff}
.bomb.th-dynamite{border-radius:6px}.bomb.th-dynamite::before{border-radius:4px 4px 0 0;background:repeating-linear-gradient(45deg,#fff 0 14px,#c1342a 14px 28px)}.bomb.th-dynamite .mod{background:linear-gradient(#4a1a16,#331210)}

.bomb.th-neon{border-radius:0;clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 22px,100% calc(100% - 22px),calc(100% - 22px) 100%,22px 100%,0 calc(100% - 22px),0 22px)}.bomb.th-neon::before{border-radius:0;background:repeating-linear-gradient(45deg,#2ef2ff 0 14px,#2a0f4d 14px 28px)}.bomb.th-neon .mod{background:#150a2e;border-color:#2ef2ff}
.sw2{display:grid;place-items:center;font-size:22px}
.tplist{display:grid;gap:8px;margin-bottom:16px}.tp{display:flex;align-items:center;gap:12px;background:var(--metal2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:48px}.tp input{width:22px;height:22px;accent-color:var(--red)}
.two .paper p{font-size:clamp(22px,2.6vw,32px)}.two .paper .box{width:42px;height:42px;font-size:28px}.two .paper li{min-height:50px}.two .cv{height:min(34vh,260px)}

/* ================= BÜYÜK GÜNCELLEME: yeni arayüz ================= */
body{background:radial-gradient(1100px 560px at 50% -8%,#2b3526 0,#171a15 62%) fixed,linear-gradient(#171a15,#171a15);}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:34px 34px}
#app,.top{position:relative;z-index:1}
.top{justify-content:flex-end}
.fl{display:inline-block;width:44px;height:30px;border:2px solid #0d0f0b;border-radius:4px;overflow:hidden;background:#222;flex:none}
.fl svg{display:block;width:100%;height:100%}

/* ---- yükleme ekranı ---- */
#loader{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;align-content:center;gap:14px;padding:16px;background:radial-gradient(circle at 50% 40%,#2b3526,#0f110d 70%);transition:opacity .5s,visibility .5s}
#loader.out{opacity:0;visibility:hidden}
.ld-top{display:flex;gap:6px;width:min(92vw,560px)}
.ld-top span,.ld-top i{flex:1;display:grid;place-items:center;padding:8px 2px;border:3px solid #0d0f0b;border-radius:8px;background:#e9ecdf;color:#1d231b;font:700 clamp(18px,5.5vw,34px) var(--fd);font-style:normal;animation:ldb 1.8s ease-in-out infinite}
.ld-top i{flex:.5;background:var(--sig)}.ld-top span:nth-child(2){animation-delay:.15s}.ld-top span:nth-child(3){animation-delay:.3s}.ld-top i:nth-of-type(1){animation-delay:.45s}.ld-top i:nth-of-type(2){animation-delay:.6s}
@keyframes ldb{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.ld-main{position:relative;width:min(88vw,540px);aspect-ratio:1/.95}
.tri{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);background:repeating-linear-gradient(45deg,var(--sig) 0 14px,#16180f 14px 28px)}
.tri-card{position:absolute;inset:3.5% 4.6% 0;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(#2a3026,#151812);display:grid;grid-template-rows:auto auto auto 1fr;justify-items:center;padding-top:3.5%}
.ld-t{font:700 clamp(26px,8.4vw,52px)/1 var(--fd);letter-spacing:.04em;color:#f4f6ee;text-shadow:0 3px 0 #000a;white-space:nowrap}
.ld-t .sm{display:inline-grid;place-items:center;width:.82em;height:.82em;margin:0 .03em;border-radius:50%;background:var(--sig);vertical-align:-.06em;position:relative}
.ld-t .sm::before{content:"";position:absolute;left:24%;top:30%;width:14%;height:20%;border-radius:50%;background:#14170f;box-shadow:.32em 0 #14170f}
.ld-t .sm::after{content:"";position:absolute;left:24%;top:52%;width:52%;height:26%;border-bottom:.09em solid #14170f;border-radius:0 0 50% 50%}
.ld-dots{display:flex;gap:10px;margin:2.5% 0 2%}.ld-dots i{width:clamp(10px,3vw,16px);height:clamp(10px,3vw,16px);border-radius:50%;border:3px solid var(--sig);animation:ldd 1.2s infinite}
.ld-dots i:nth-child(2){animation-delay:.2s}.ld-dots i:nth-child(3){animation-delay:.4s}
@keyframes ldd{0%,100%{background:transparent;transform:scale(1)}40%{background:var(--sig);transform:scale(1.3)}}
.ld-brand{width:62%;text-align:center;padding:1.2% 0;background:linear-gradient(#f25a4c,#a52f26);border-block:3px solid #0d0f0b;font:700 clamp(24px,7.6vw,46px)/1.1 var(--fd);letter-spacing:.05em;color:#fff;text-shadow:0 3px 0 #0008}
.ld-remote{width:15%;margin-top:3%;animation:ldr 1.4s ease-in-out infinite}
@keyframes ldr{50%{transform:translateY(-4px)}}
.ld-remote .ant{animation:pulse .7s infinite}
.fan{position:absolute;left:-1%;bottom:-3%;width:25%;animation:spin 1s linear infinite;filter:drop-shadow(0 4px 0 #0008)}
@keyframes spin{to{transform:rotate(360deg)}}
.cable{position:absolute;right:-2%;top:30%;width:22%;height:70%;transform-origin:50% 0;animation:swing 2.4s ease-in-out infinite;overflow:visible}
@keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.cable .sp1,.cable .sp2,.cable .sp3{animation:spk .5s steps(2) infinite;transform-box:fill-box;transform-origin:center}
.cable .sp2{animation-delay:.15s}.cable .sp3{animation-delay:.3s}
@keyframes spk{0%{opacity:1;transform:scale(1) rotate(0)}50%{opacity:.2;transform:scale(.4) rotate(45deg)}}

/* ---- menü ---- */
.menu{max-width:560px;margin:0 auto;padding-block:6px;gap:14px;background:none;border-radius:0}

.mred{background:linear-gradient(#f4604f,#b3342a)}.mblue{background:linear-gradient(#52a0ec,#2459a6)}.mgold{background:linear-gradient(#f8d24c,#c48d10);color:#2b1f00;text-shadow:0 1px 0 #fff7}
.mb.wide{width:100%}
.mrow{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;margin-top:108px}

.mascot .sp{animation:pulse .5s infinite}
.credit{color:var(--muted);font-size:15px;max-width:34ch;text-align:center}
